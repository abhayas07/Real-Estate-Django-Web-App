{% extends 'base.html' %}

{% block title %} | Leave a Review {% endblock %}

{% block content %}
<section id="showcase-inner" class="py-5 text-white">
  <div class="container">
    <div class="row text-center">
      <div class="col-md-12">
        <h1 class="display-4">Leave a Review</h1>
        <p class="lead">{{ listing.title }}</p>
      </div>
    </div>
  </div>
</section>

<section id="review" class="py-5">
  <div class="container">
    <div class="row">
      <div class="col-md-6 mx-auto">
        <div class="card review-card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-star"></i> Rate This Property</h4>
          </div>
          <div class="card-body">
            <form method="POST">
              {% csrf_token %}

              <div class="form-group">
                <label for="rating">Rating (1-5)</label>
                <select name="rating" id="rating" class="form-control" required>
                  <option value="5">★★★★★ — Excellent</option>
                  <option value="4">★★★★ — Good</option>
                  <option value="3">★★★ — Average</option>
                  <option value="2">★★ — Poor</option>
                  <option value="1">★ — Terrible</option>
                </select>
              </div>

              <div class="form-group">
                <label for="comment">Comment</label>
                <textarea id="comment" name="comment" class="form-control" rows="4" required
                          placeholder="Share your experience with this property..."></textarea>
              </div>

              <button type="submit" class="btn btn-secondary btn-block">
                <i class="fas fa-paper-plane mr-2"></i>Submit Review
              </button>
              <a href="{% url 'listing' listing.id %}" class="btn btn-light btn-block mt-2">Cancel</a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
