{% extends 'base.html' %}

{% block title %} | Leave a Review {% endblock %}

{% block content %}
<section id="showcase-inner" class="py-5 text-white">
  <div class="container">
    <div class="row text-center">
      <div class="col-md-12">
        <h1 class="display-4">Rate & Review</h1>
        <p class="lead">{{ listing.title }}</p>
      </div>
    </div>
  </div>
</section>

<!-- Breadcrumb -->
<section id="bc">
  <div class="container">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a href="{% url 'index' %}"><i class="fa-solid fa-house"></i> Home</a>
        </li>
        <li class="breadcrumb-item">
          <a href="{% url 'listings' %}">Listings</a>
        </li>
        <li class="breadcrumb-item">
          <a href="{% url 'listing' listing.id %}">{{ listing.title }}</a>
        </li>
        <li class="breadcrumb-item active">Leave Review</li>
      </ol>
    </nav>
  </div>
</section>

<section id="review" class="py-5">
  <div class="container">
    <div class="row">
      <div class="col-lg-6 col-md-8 mx-auto">
        <div class="card review-card shadow-md border-0">
          <div class="card-header bg-primary text-white">
            <h4 class="mb-0 text-white font-weight-bold">
              <i class="fa-solid fa-star text-warning mr-2"></i> Share Your Property Experience
            </h4>
          </div>
          <div class="card-body p-4">
            <form method="POST">
              {% csrf_token %}

              <div class="form-group mb-4">
                <label for="rating" class="font-weight-bold small text-muted text-uppercase">Select Star Rating</label>
                <div class="input-icon-group mb-0">
                  <i class="fa-solid fa-star input-icon"></i>
                  <select name="rating" id="rating" class="form-control" required>
                    <option value="5" selected>★★★★★ — 5 Stars (Exceptional)</option>
                    <option value="4">★★★★☆ — 4 Stars (Very Good)</option>
                    <option value="3">★★★☆☆ — 3 Stars (Average)</option>
                    <option value="2">★★☆☆☆ — 2 Stars (Below Expectations)</option>
                    <option value="1">★☆☆☆☆ — 1 Star (Poor Experience)</option>
                  </select>
                </div>
              </div>

              <div class="form-group mb-4">
                <label for="comment" class="font-weight-bold small text-muted text-uppercase">Detailed Feedback</label>
                <textarea id="comment" name="comment" class="form-control" rows="5" required
                          placeholder="What did you love about the location, amenities, architectural details, or neighborhood?"></textarea>
              </div>

              <button type="submit" class="btn btn-secondary btn-block py-3 font-weight-bold mb-2">
                <i class="fa-solid fa-paper-plane mr-2"></i> Publish Review
              </button>
              <a href="{% url 'listing' listing.id %}" class="btn btn-light btn-block">
                <i class="fa-solid fa-xmark mr-1"></i> Cancel
              </a>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
