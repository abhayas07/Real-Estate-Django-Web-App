{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <!-- Instant Background Tone Initialization (Prevents FOUC) -->
  <script>
    (function () {
      var savedBg = localStorage.getItem('realestate_bg_tone') || 'soft-slate';
      document.documentElement.setAttribute('data-bg', savedBg);
    })();
  </script>

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Font Awesome 6.6 (Latest) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

  <!-- Lightbox -->
  <link rel="stylesheet" href="{% static 'css/lightbox.min.css' %}">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- Title Block -->
  <title>Real Estate {% block title %}{% endblock %}</title>

  <!-- Extra CSS block to include page-specific styles -->
  {% block extra_css %}
  {% endblock %}
</head>

<body>
  <!-- Top Bar -->
  {% include 'partials/_topbar.html' %}

  <!-- NavBar -->
  {% include 'partials/_navbar.html' %}

  <!-- Flash messages (site-wide) -->
  {% include 'partials/_alerts.html' %}

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include 'partials/_footer.html' %}

  <!-- Back To Top -->
  <button id="back-to-top" type="button" aria-label="Back to top">
    <i class="fas fa-chevron-up"></i>
  </button>

  <!-- Scripts -->
  <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/lightbox.min.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
